# Font (kept yours)
font_family      Hack Nerd Font Mono
bold_font        Hack Nerd Font Mono Bold
italic_font      Hack Nerd Font Mono Italic
bold_italic_font Hack Nerd Font Mono Bold Italic
font_size        12.0

# Theme - Rosé Pine (official palette)
# Source: https://github.com/rose-pine/kitty/blob/main/dist/rose-pine.conf
background #191724
foreground #e0def4
selection_background #403d52
selection_foreground #e0def4
url_color #c4a7e7
cursor #524f67
cursor_text_color #e0def4
active_border_color #31748f
inactive_border_color #403d52
bell_border_color #f6c177
wayland_titlebar_color #191724
macos_titlebar_color #191724
active_tab_foreground #e0def4
active_tab_background #26233a
inactive_tab_foreground #6e6a86
inactive_tab_background #191724
tab_bar_background #191724

color0 #26233a
color1 #eb6f92
color2 #31748f
color3 #f6c177
color4 #9ccfd8
color5 #c4a7e7
color6 #ebbcba
color7 #e0def4
color8 #6e6a86
color9 #eb6f92
color10 #31748f
color11 #f6c177
color12 #9ccfd8
color13 #c4a7e7
color14 #ebbcba
color15 #e0def4

# Window
remember_window_size  yes
initial_window_width  640
initial_window_height 400
confirm_os_window_close 0
close_on_child_death yes

# Padding / Margin
single_window_margin_width 20
window_border_width 0.5pt
draw_minimal_borders yes
placement_strategy center

# Tab bar
tab_bar_edge bottom
tab_bar_style fade
tab_separator " ┇"
tab_fade 0.25 0.5 0.75 1
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0
tab_bar_min_tabs 2
tab_switch_strategy previous
active_tab_font_style   bold-italic
inactive_tab_font_style normal

# Scrollback
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# Mouse
mouse_hide_wait 0
url_style curly
url_prefixes http https file ftp gemini irc gopher mailto news git
detect_urls yes
copy_on_select no
strip_trailing_spaces always
focus_follows_mouse no

# Cursor
cursor_shape block
cursor_beam_thickness 1.5
cursor_underline_thickness 2.0
cursor_blink_interval -1
cursor_stop_blinking_after 15.0

# Bell
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab yes

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Advanced
enabled_layouts splits,stack
shell zsh
shell_integration enabled
allow_remote_control no
clipboard_control write-clipboard write-primary
allow_hyperlinks yes
term xterm-kitty
inactive_text_alpha 0.85
tab_title_template "{index}: {title}"

# Shortcuts
# Tabs
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+] next_tab
map ctrl+shift+[ previous_tab
# Windows: split, navigate, close, and arrange
map ctrl+shift+d launch --location=hsplit
map ctrl+shift+s launch --location=vsplit
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
map ctrl+shift+q close_window
map ctrl+shift+e layout_action equalize
map ctrl+shift+m toggle_layout stack
# Resize (Alt keeps these separate from navigation)
map ctrl+alt+h resize_window narrower 5
map ctrl+alt+j resize_window shorter 5
map ctrl+alt+k resize_window taller 5
map ctrl+alt+l resize_window wider 5
# Clipboard, scrollback, search, URLs, reload, and fullscreen
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+p show_scrollback
map ctrl+shift+f search_forward
map ctrl+shift+u open_url_with_hints
map ctrl+shift+r load_config_file
map ctrl+shift+z toggle_fullscreen
